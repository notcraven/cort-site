name: Update recent blog posts

on:
  schedule:
    - cron: "17 11 * * *"   # daily, around 6–7 AM Michigan time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_posts.py
      - .github/workflows/update-posts.yml

permissions:
  contents: write

concurrency:
  group: update-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_posts.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain resources.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resources.html
            git commit -m "Update recent Game World Therapy posts"
            git push
          else
            echo "No changes."
          fi
